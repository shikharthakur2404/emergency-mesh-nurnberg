buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 34
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
        REACT_NATIVE_NODE_MODULES_DIR = new File(rootProject.projectDir, "../node_modules/react-native")
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    tasks.withType(Exec).configureEach {
        def currentPath = environment['PATH'] ?: System.getenv('PATH') ?: ''
        if (!currentPath.contains('/opt/homebrew/bin')) {
            environment 'PATH', "/opt/homebrew/bin:/usr/local/bin:${currentPath}"
        }
    }
}
